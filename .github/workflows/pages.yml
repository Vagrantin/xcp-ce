name: Deploy preview Pages (from xcp-hl branch)
run-name: "Preview xcp-hl@${{ inputs.xcp_hl_ref || 'claude/gracious-ride-99qg08' }}"

# Staging deployment. The Hugo source is NOT in this repository: it is pulled
# from Vagrantin/xcp-hl at the ref below, built here, and published to this
# repository's Pages site. Nothing is ever written back to xcp-hl.

on:
  workflow_dispatch:
    inputs:
      xcp_hl_ref:
        description: 'Branch, tag or SHA in Vagrantin/xcp-hl to build'
        required: false
        default: 'claude/gracious-ride-99qg08'
  schedule:
    - cron: '17 5 * * *'   # daily rebuild of the default ref; drop if unwanted

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.151.0'
  HUGO_SHA256: 'f2fe3b4ef90bf053d93c713eca1d4d5a467d8d2d5da858a448d55eb71ad44ddf'
  XCPNG_SERIES: "8.3"
  REPO_ARCH: "x86_64"
  SRC_REF: ${{ inputs.xcp_hl_ref || 'claude/gracious-ride-99qg08' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The documentation source, from the other repository.
      # Public repo: the default GITHUB_TOKEN is enough for a cross-repo READ.
      - uses: actions/checkout@v4
        with:
          repository: Vagrantin/xcp-hl
          ref: ${{ env.SRC_REF }}

      - name: Show what is being built
        run: |
          echo "xcp-hl ref : ${SRC_REF}"
          echo "commit     : $(git rev-parse HEAD)"

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: site/go.sum

      - name: Install Hugo ${{ env.HUGO_VERSION }} (extended)
        run: |
          set -euo pipefail
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sSLo /tmp/hugo.tar.gz "$url"
          echo "${HUGO_SHA256}  /tmp/hugo.tar.gz" | sha256sum -c -
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install -m 0755 /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Sync release-matrix data
        run: |
          set -euo pipefail
          mkdir -p site/data
          cp docs/_data/releases.yml docs/_data/xoa_releases.yml site/data/

      - name: Assert the translations match the English structure
        run: python3 site/scripts/check_translation_parity.py

      # --baseURL overrides hugo.toml's https://vagrantin.github.io/xcp-hl/
      # with this repository's Pages URL, so assets resolve under /xcp-ce/.
      - name: Build site
        working-directory: site
        run: |
          set -euo pipefail
          hugo --gc --minify --printPathWarnings --destination ../_site \
               --baseURL "${{ steps.pages.outputs.base_url }}/" \
               2>&1 | tee /tmp/hugo-build.log

      - name: Assert no two pages claim the same URL
        run: |
          set -euo pipefail
          if grep -q 'Duplicate target paths' /tmp/hugo-build.log; then
            echo "::error::two or more pages are being written to the same path"
            grep 'Duplicate target paths' /tmp/hugo-build.log
            exit 1
          fi
          echo "✅ every page has a URL to itself"

      - name: Assert the language switcher is correct on every page
        run: python3 site/scripts/check_switcher.py _site

      - name: Assert every loaded asset is local
        run: |
          set -euo pipefail
          found=$(
            {
              grep -rIoE '<(script|link|img|iframe|source)[^>]+(src|href)="https?://[^"]+"' \
                _site --include='*.html' || true
              grep -rIoE 'url\(["'"'"']?https?://[^)"'"'"']+' \
                _site --include='*.css' || true
            } | grep -vE '<link[^>]+rel="(canonical|alternate|me)"' || true
          )
          if [ -n "${found}" ]; then
            echo "::error::the build loads an asset from an external origin"
            printf '%s\n' "${found}"
            exit 1
          fi
          echo "✅ every script, stylesheet and image is served from this site"

      - name: Stage placeholder yum repository
        run: |
          set -euo pipefail
          PKGDIR="_site/repo/${XCPNG_SERIES}/${REPO_ARCH}"
          mkdir -p "${PKGDIR}/repodata"
          cat > "${PKGDIR}/repodata/repomd.xml" <<'EOF'
          <!-- Placeholder. In Vagrantin/xcp-hl this file is generated by
               createrepo_c and signed with the XCP-hl GPG key. Its only job here
               is to prove that the Hugo build does not delete this tree. -->
          EOF
          echo "placeholder" > "${PKGDIR}/.placeholder"

      - name: Verify docs and repository coexist in one _site
        run: |
          set -euo pipefail
          fail=0
          for f in index.html docs/index.html docs/guides/features/index.html \
                   "repo/${XCPNG_SERIES}/${REPO_ARCH}/repodata/repomd.xml"; do
            if [ -f "_site/${f}" ]; then
              echo "  ✅ _site/${f}"
            else
              echo "  ❌ MISSING _site/${f}"; fail=1
            fi
          done
          [ "${fail}" -eq 0 ] || { echo "::error::the two trees did not survive in one _site"; exit 1; }
          echo "▶ $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
