name: Deploy preview Pages
run-name: "Deploy the Hugo docs preview (${{ github.event_name }})"

# Preview deployment for Vagrantin/xcp-hl#60.
#
# This repository is being used as a staging ground: it is a dead precursor of
# xcp-hl, and its Pages site is free, so the new documentation delivery can be
# proven end to end without putting https://vagrantin.github.io/xcp-hl/ at risk.
#
# The Jekyll site under docs/ is left in place, simply no longer published.
# Reverting the commit that introduced this file restores the old delivery.
#
# This mirrors the SHAPE of xcp-hl's own .github/workflows/pages.yml on purpose,
# so what gets validated here is the thing that will run there at cutover:
#
#   1. the site is built into ../_site FIRST, because the generator cleans its
#      destination directory,
#   2. the yum repository tree is staged into _site AFTERWARDS,
#   3. one artifact, one deployment.
#
# Step 2 here stages a PLACEHOLDER tree rather than real signed RPMs — this
# repository has no releases and no GPG secrets. It is still worth doing: it is
# what proves Hugo's destination cleaning does not eat the repository tree, which
# is the load-bearing constraint on the whole migration. Signature verification
# against a real `yum` run remains a phase 5 acceptance test in xcp-hl itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.151.0'
  HUGO_SHA256: 'f2fe3b4ef90bf053d93c713eca1d4d5a467d8d2d5da858a448d55eb71ad44ddf'
  XCPNG_SERIES: "8.3"
  REPO_ARCH: "x86_64"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Supplies the canonical Pages base URL, so it is never hardcoded here.
      - uses: actions/configure-pages@v5
        id: pages

      # Hugo Modules are Go modules: the theme is resolved by the go tool.
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: site/go.sum

      - name: Install Hugo ${{ env.HUGO_VERSION }} (extended)
        run: |
          set -euo pipefail
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sSLo /tmp/hugo.tar.gz "$url"
          echo "${HUGO_SHA256}  /tmp/hugo.tar.gz" | sha256sum -c -
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install -m 0755 /tmp/hugo /usr/local/bin/hugo
          hugo version

      # Must run before the repository tree is staged: Hugo cleans its
      # destination directory, exactly as Jekyll does.
      - name: Build site
        working-directory: site
        run: |
          set -euo pipefail
          # --baseURL on the command line, so the site source stays byte-identical
          # to xcp-hl's copy. At cutover this becomes the production URL.
          hugo --gc --minify --destination ../_site \
               --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Assert every loaded asset is local
        run: |
          set -euo pipefail
          found=$(
            {
              grep -rIoE '<(script|link|img|iframe|source)[^>]+(src|href)="https?://[^"]+"' \
                _site --include='*.html' || true
              grep -rIoE 'url\(["'"'"']?https?://[^)"'"'"']+' \
                _site --include='*.css' || true
            } | grep -vE '<link[^>]+rel="(canonical|alternate|me)"' || true
          )
          if [ -n "${found}" ]; then
            echo "::error::the build loads an asset from an external origin"
            printf '%s\n' "${found}"
            exit 1
          fi
          echo "✅ every script, stylesheet and image is served from this site"

      # The coexistence rehearsal. In xcp-hl this is where createrepo_c runs and
      # repomd.xml is signed; here it just has to survive the Hugo build above.
      - name: Stage placeholder yum repository
        run: |
          set -euo pipefail
          PKGDIR="_site/repo/${XCPNG_SERIES}/${REPO_ARCH}"
          mkdir -p "${PKGDIR}/repodata"
          cat > "${PKGDIR}/repodata/repomd.xml" <<'EOF'
          <!-- Placeholder. In Vagrantin/xcp-hl this file is generated by
               createrepo_c and signed with the XCP-hl GPG key. Its only job here
               is to prove that the Hugo build does not delete this tree. -->
          EOF
          echo "placeholder" > "${PKGDIR}/.placeholder"

      - name: Verify docs and repository coexist in one _site
        run: |
          set -euo pipefail
          fail=0
          for f in index.html docs/index.html docs/guides/features/index.html \
                   "repo/${XCPNG_SERIES}/${REPO_ARCH}/repodata/repomd.xml"; do
            if [ -f "_site/${f}" ]; then
              echo "  ✅ _site/${f}"
            else
              echo "  ❌ MISSING _site/${f}"; fail=1
            fi
          done
          [ "${fail}" -eq 0 ] || { echo "::error::the two trees did not survive in one _site"; exit 1; }
          echo "▶ $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
